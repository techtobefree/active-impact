<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e7d5b" />
  <meta name="description" content="Local service projects, impact tokens, and a catalog of needs and offers." />
  <title>Active Impact</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    // Apply the saved theme before first paint (no flash). Default is light/white;
    // dark is opt-in (Me → Dark mode) and is never forced by the OS setting.
    try { if (localStorage.getItem('ai_theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header id="topbar" class="hidden">
    <a href="#/" class="brand">🌱 Active Impact</a>
    <span class="spacer"></span>
    <!-- Scan = check in, from anywhere: the code carries its own event
         (CHECKIN_PROOF.md §7.1b). A drawn glyph rather than an emoji — this is
         the most-tapped control in the bar and no emoji reads as "QR code". -->
    <a href="#/scan" id="scan-btn" class="icon-btn" aria-label="Scan a code to check in" title="Scan to check in">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/>
        <rect x="8" y="8" width="8" height="8" rx="1" fill="currentColor"/>
      </svg>
    </a>
    <a href="#/wallet" id="balance" class="balance">🪙 0</a>
  </header>

  <main id="view"><div class="spinner">Loading…</div></main>

  <a id="fab-log" class="fab hidden" href="#/log" aria-label="Log a service">＋</a>

  <!-- Four tabs: Home IS the projects feed now (FEED.md F2), so a separate
       Projects tab would just reopen the current screen. -->
  <nav id="nav" class="hidden">
    <a href="#/" data-tab="home"><span class="ico">🌱</span>Home</a>
    <a href="#/catalog" data-tab="catalog"><span class="ico">🎁</span>Catalog</a>
    <a href="#/wallet" data-tab="wallet"><span class="ico">🪙</span>Wallet</a>
    <a href="#/me" data-tab="me"><span class="ico">👤</span>Me</a>
  </nav>

  <script type="module" src="/app.js"></script>
</body>
</html>
